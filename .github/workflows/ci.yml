name: CI - TEST
on:
  pull_request: 
    branches:[master,development]
  push: [development]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services: 
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: blogapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test-user"
          --health-intervals 5s
          --health-timeout 5s
          --health-retries 10
          
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v5.1.0
        with: 
          dotnet-version: '10.0.401'
      
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with: 
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-
          
      - name: Restore dependencies
        uses: dotnet restore BlogApp.slnx
        
      - name: Build
        uses: dotnet build BlogApp.slnx --no-restore -c Release
        
      - name: Run Unit Tests
        run: |
          dotnet test tests/BlogApp.UnitTests/BlogApp.UnitTests.csproj \
            --no-build \
            -c Release \
            --logger "trx;LogFileName=unit-results.trx" \
            --results-directory ./test-results
          
      - name: Run Integration Tests
        env:
          ConnectionStrings__Default: >-
            Host=localhost;
            Port=5432;
            Database=blogapp_test;
            Username=test_user;
            Password=test_password;
        run: |
          dotnet test tests/BlogApp.IntegrationTests/BlogApp.IntegrationTests.csproj \
            --no-build \
            -c Release \
            --logger "trx;LogFileName=integration-results.trx" \
            --results-directory ./test-results
          
      - name: Upload Test Results
        uses: actions/upload-artifact
        if: always()
        with: 
          name: test-results
          path: ./test-results/*.trx