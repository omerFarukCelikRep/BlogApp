name: CD - Deploy

on:
  push: 
    branches: [master]
    
env: 
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        
      - name: Build & Push API
        uses: docker/build-push-action@v7
        with: 
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/blogapp-api:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/blogapp-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
  
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        
      - name: Copy deploy files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "compose.prod.yaml,nginx/,prometheus.yml,scripts/"
          target: /opt/blogapp
          
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DOCKER_USERNAME,IMAGE_TAG
          script: |
            export IMAGE_TAG=${{ github.sha }}
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            cd /opt/blogapp
            bash scripts/deploy.sh
            
      - name: Notify on success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "SHA: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "SHA: ${{ github.sha }}"