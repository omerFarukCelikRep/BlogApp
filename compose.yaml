services:
  blogapp.api:
    container_name: blogapp.api
    build:
      context: .
      dockerfile: src/BlogApp.Api/Dockerfile
    image: blogapp.api
    ports:
      - "5180:5180"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5180
      - ConnectionStrings__DefaultConnection=Host=db;Database=BlogApp;Username=appuser;Password=apppassword
      - Cache__Provider=Hybrid
      - Cache__Redis__ConnectionString=redis:6379
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=guest
      - RabbitMQ__Password=guest
      - Serilog__ElasticSearch__Enabled=true
      - Serilog__ElasticSearch__Urls__0=http://elasticsearch:9200
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    networks:
      - app-network
  
  db:
    container_name: postgres
    image: postgres:18.4-alpine
    restart: always
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: blogapp
    volumes:
      - dbdata:/var/lib/postgresql

    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U appuser -d blogapp" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network
  
  redis:
    container_name: redis
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli","ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3-management
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - app-network

  elasticsearch:
    container_name: elasticsearch
    image: elasticsearch:9.4.4
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL","curl -s http://elasticsearch:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

volumes:
  dbdata:
  redisdata:
  esdata:

networks:
  app-network:
    driver: bridge